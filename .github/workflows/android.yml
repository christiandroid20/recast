name: Build APK

on:
  push:
    branches-ignore:
      - 'l10n_**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      app_name: ${{ steps.brand.outputs.app_name }}

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache cmake libcurl4-openssl-dev ninja-build imagemagick

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: android-ccache-${{ github.sha }}
          restore-keys: android-ccache-

      # Applies branding/brand.conf (app name, package id) and generates the
      # launcher icons / TV banner from branding/logo.png.
      - name: Apply branding
        id: brand
        run: |
          bash branding/apply_brand.sh
          source <(tr -d '\r' < branding/brand.conf)
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      # Forks have no access to the original release keystore: sign with the
      # debug keystore from the repo (fine for sideloading on your own devices).
      - name: Use debug signing
        run: sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/g' shell/android-studio/flycast/build.gradle.kts

      - name: Build APK
        working-directory: shell/android-studio
        run: ./gradlew assembleRelease --parallel

      - name: Name the APK
        run: |
          SAFE_NAME=$(echo "${{ steps.brand.outputs.app_name }}" | tr ' ' '-')
          mkdir -p dist
          cp shell/android-studio/flycast/build/outputs/apk/release/*-release.apk "dist/${SAFE_NAME}-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.brand.outputs.app_name }}-apk
          path: dist/*.apk

      # Publishes the APK in the repo's Releases page when you push a tag like v1.0
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
