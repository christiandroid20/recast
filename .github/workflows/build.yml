name: Build Recast Multiplatform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. BUILD ANDROID (APK)
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        working-directory: shell/android-studio
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recast-android-release
          path: shell/android-studio/flycast/build/outputs/apk/release/*.apk

  # ==========================================
  # 2. BUILD LINUX (Binary)
  # ==========================================
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgl1-mesa-dev libasound2-dev libpulse-dev libx11-dev libxi-dev libxrandr-dev libudev-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build -j$(nproc)

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recast-linux-x64
          path: build/flycast

  # ==========================================
  # 3. BUILD WINDOWS (Executable)
  # ==========================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recast-windows-x64
          path: build/Release/
