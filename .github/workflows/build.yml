name: Auto Clean & Build Recast v1.0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Previous Builds and Apply Recast v1.0 Overhaul
        run: |
          python3 auto_clean_patch.py

      - name: Configure CMake (Forced Standalone & GUI Enabled)
        run: |
          cmake -B build -DLIBRETRO=OFF -DENABLE_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Recast v1.0
        run: |
          cmake --build build --config Release --clean-first
