name: Build Recast v1.0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules (Recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libevdev-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libudev-dev \
            libvulkan-dev


      - name: Execute Local Clean and Branding Script
        run: |
          python3 clean_and_patch.py

      - name: Configure CMake (Standalone & GUI Enabled)
        run: |
          cmake -B build -DLIBRETRO=OFF -DENABLE_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Recast v1.0 Clean
        run: |
          cmake --build build --config Release --clean-first
