name: Build Recast v1.0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libgl1-mesa-dev libevdev-dev

      - name: Clean Previous Builds and Apply Recast v1.0 Overhaul
        run: |
          python3 auto_clean_patch.py

      - name: Configure CMake
        run: |
          cmake -B build -DLIBRETRO=OFF -DENABLE_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Recast v1.0
        run: |
          cmake --build build --config Release --clean-first