# Único punto de configuración de la marca de tu emulador.
# Edita estos dos valores y (opcional) reemplaza branding/logo.png con tu logo.
# El workflow de GitHub y branding/apply_brand.sh los aplican automáticamente.

# Nombre visible de la app (letras, números, espacios, punto, guion).
APP_NAME="Recast"

# ID único del paquete Android (minúsculas, con puntos). Debe ser distinto de
# com.flycast.emulator para poder instalarlo junto al Flycast oficial.
APP_ID="com.recast.emulator"
